<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>投递记录 · BOSS 直聘批量投递助手</title>
  <link rel="stylesheet" href="records.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <div class="logo">投</div>
        <div>
          <h1>投递记录</h1>
          <p>所有批量投递的结果都记在本地，随时导出成表格</p>
        </div>
      </div>
      <div class="kpi">
        <div class="k"><b id="kTotal">0</b><span>累计投递</span></div>
        <div class="k"><b id="kToday">0</b><span>今日</span></div>
        <div class="k"><b id="kCompany">0</b><span>涉及公司</span></div>
      </div>
    </header>

    <section class="toolbar">
      <div class="search">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M11.2 10.1a5.2 5.2 0 1 1 1-1l3 3-1 1-3-3zM6.9 10.4a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="currentColor"/>
        </svg>
        <input type="text" id="q" placeholder="搜索职位或公司…">
      </div>

      <select id="range">
        <option value="all">全部时间</option>
        <option value="today">今天</option>
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
      </select>

      <button class="btn primary" id="exportBtn">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M7.2 1.5h1.6v7.2l2.4-2.4 1.1 1.1L8 11.7 3.7 7.4l1.1-1.1 2.4 2.4V1.5zM2.5 12.2h11v1.6h-11v-1.6z" fill="currentColor"/>
        </svg>
        导出表格
      </button>

      <button class="btn ghost" id="clearBtn">清空</button>
    </section>

    <section class="tablewrap">
      <table id="tbl">
        <thead>
          <tr>
            <th style="width:56px">#</th>
            <th>职位</th>
            <th>公司</th>
            <th style="width:110px">薪资</th>
            <th style="width:78px">匹配分</th>
            <th style="width:110px">地区</th>
            <th style="width:96px">发布时间</th>
            <th style="width:170px">岗位要求</th>
            <th style="width:150px">AI 判断</th>
            <th style="width:150px" data-sort="at">投递时间 <i class="arrow">↓</i></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty">
        <div class="emptyIcon">📄</div>
        <p>还没有投递记录</p>
        <span>在 BOSS 直聘职位页打开右下角面板，开始投递后这里会自动生成表格</span>
      </div>
    </section>

    <footer class="foot">
      <span id="countText">共 0 条</span>
      <span class="dot">·</span>
      <span>导出格式为 CSV（UTF-8 BOM），可直接用 Excel / WPS 打开</span>
    </footer>
  </div>
  <script src="records.js"></script>
</body>
</html>
